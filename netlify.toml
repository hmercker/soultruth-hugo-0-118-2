[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_ENV = "production"
  TZ = "UTC"

[context.production.environment]
  HUGO_VERSION = "0.118.2"
  HUGO_EXTENDED = "true"

[context.deploy-preview]
  command = "hugo -b $DEPLOY_URL"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.118.2"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.118.2"

[[headers]]
for = "/*"
[headers.values]
  Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src * data: https:;"

# Browser caching (added for page speed).
# CSS and JS file names contain a fingerprint that changes whenever the file changes,
# and the font files never change, so browsers may keep them for a year.
[[headers]]
for = "/css/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when replaced, so browsers keep them for 7 days only.
[[headers]]
for = "/images/*"
[headers.values]
  Cache-Control = "public, max-age=604800"
